<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../assets/css/main.css">
    <title>Document</title>
    <style>
    </style>
</head>

<body>
    <h1>Blog</h1>
    <div class="container_blog d-flex flex-column alight-content-between">
        <!-- Search -->
        <div class="search_blog d-flex d-md-flex d-sm-flex align-items-center my-2 ">
            <div class="search_blog--input  flex-grow-1 flex-sm-grow-1 flex-md-grow-0-5">
                <input type="search" id="form1" placeholder="Tìm kiếm" />
            </div>
            <div class="search_blog--icon" onclick="searchBlog(1,pageSizeDefault)">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <!-- Filter -->
        <div class="blog_group my-2 d-flex justify-content-between align-items-center">
            <div class="filter_blog">
                <select class="form-select my-2" id="filter_blog" onchange="getblogByType(1,pageSizeDefault)"></select>
            </div>
            <div class="add_blog" onclick="toggleAddBlogForm()">
                <i class="fa-solid fa-square-plus"></i>
            </div>
        </div>
        <!-- Total -->
        <div class="total_blogs d-flex justify-content-end">
            <span style="font-weight: 800 ; padding: 0 10px;">Total: </span>
            <span style="color:var(--color-primary);font-weight: 800  " id="total_blogs"></span>
        </div>
        <!-- Blog item -->
        <div class="blog_content my-3">
            <div class="row gx-0" id="blogTableBody"></div>
        </div>
        <!-- Blog detail -->
        <div class="add_blog--form position-absolute d-none">
            <section class="p-4">
                <div class="close_add_blog--icon d-flex justify-content-end mb-3" onclick="toggleAddBlogForm()">
                    <i class="fa-solid fa-square-xmark" onclick=""></i>
                </div>
                <div class="add_blog--group d-flex">

                    <!-- Ảnh chính -->
                    <div class="add_blog--img">
                        <div class="border rounded-4 mb-3 primary_image">
                            <div class="mb-3 p-3">
                                <input type="file" id="imageInput" style="display: none;" accept="image/*"
                                    onchange="handleImageUpload(event,'selectedBlogImage')" />
                                <label for="imageInput">
                                    <i id="plusIcon" class="fas fa-plus-circle"></i>
                                </label>
                            </div>
                            <img id="selectedBlogImage" style="max-width: 100%;margin: auto;" class="rounded-4 fit"
                                src="" />
                        </div>
                    </div>

                    <!-- Tiêu đề -->
                    <div class="add_blog--title ms-3 ">
                        <h4 class="title flex-column text-dark blog_detail--name">
                            <input class="p-2 border-bottom w-100" id="blog_detail--name" type="text" placeholder="Tiêu đề">
                        </h4>
                    </div>
                </div>
                <div class="add_blog--content p-3">
                    <!-- Content -->
                    <div class="row gx-5">
                        <div class="col-lg-6">
                            <h2>Nội dung</h2>
                        </div>
                        <textarea id="textPalce"></textarea>
                    </div>
                </div>
                <div class="add_blog--button my-3 d-flex justify-content-end">
                    <button type="button" class="btn btn-light border border-secondery mx-2"
                        onclick="toggleAddBlogForm()">Cancle</button>
                    <button type="button" class="btn btn-success" id="addBlogBtn" onclick="addblog()">Add</button>
                    <button type="button" class="btn btn-success" id="updateBlogBtn"
                        onclick="updateblog()">Update</button>
                </div>
            </section>
        </div>
        <!-- Pagination -->
        <div class="pagination_blog d-md-flex justify-content-md-end d-sm-flex justify-content-sm-center">
            <nav>
                <ul class="pagination d-flex justify-content-center pagination-rounded-flat pagination-success "
                    id="pagination_blog--nav">
                </ul>
            </nav>
        </div>
        <div class="overlay d-none"></div>
    </div>
</body>

</html>
